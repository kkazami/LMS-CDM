packages:
  - "apps/*"
  - "packages/*"
# Worklets 0.10.1 imports these from its Babel plugin but omits their declarations.
# Declare them at the package boundary so isolated pnpm installs resolve them.
packageExtensions:
  'react-native-worklets@0.10.1':
    dependencies:
      '@babel/generator': 7.29.8
      '@babel/traverse': 7.29.10
# Security patches scoped to the web parser/storage and Prisma toolchain parents.
overrides:
  'officeparser>pdfjs-dist': 6.2.108
  'officeparser>@xmldom/xmldom': 0.9.12
  '@vercel/blob>undici': 6.29.1
  '@vercel/cli-config>zod': 4.6.6
  '@prisma/config>deepmerge-ts': 8.0.2
  '@prisma/config>effect': 3.22.1
  'prisma>mysql2': 3.24.6
  'ajv@8.20.0>fast-uri': 3.1.9
  # Sprint 1: stay within the consuming parents' existing compatible ranges.
  'shell-quote@1.8.3': 1.12.0
  'node-forge@1.3.3': 1.4.3
  'brace-expansion@1.1.12': 1.1.22
  'brace-expansion@2.1.4': 2.1.8
  'brace-expansion@5.0.4': 5.0.13
  'picomatch@2.3.1': 2.3.2
  'js-yaml@4.1.1': 4.3.2
  'compression@1.8.1': 1.8.2
  'ip-address@10.7.0': 10.7.6
  'browserslist@4.28.1': 4.29.6
  'baseline-browser-mapping@2.10.8': 2.11.38
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  esbuild: true
  prisma: true
  sharp: false
