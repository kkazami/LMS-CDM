appId: com.lumina.lms
---
- runFlow:
    file: login.yaml
    env:
      EMAIL: teacher@example.invalid
- takeScreenshot: professor-dashboard-light
- tapOn:
    id: ics-queue-grading
- assertVisible: "To Grade"
- tapOn: "Close modal"
- tapOn:
    id: ics-queue-requests
- tapOn: "Open enrollment requests for Programming Fundamentals and Problem Solving"
- assertVisible: "Pending Enrollment Approvals (2)"
- tapOn:
    text: "Approve"
    index: 0
- assertVisible: "Pending Enrollment Approvals (1)"
- tapOn: "Reject"
- assertNotVisible: "Pending Enrollment Approvals (1)"
- back
- tapOn: "Use dark appearance"
- takeScreenshot: professor-dashboard-dark
- tapOn: "More tab"
- takeScreenshot: professor-tools-dark
- tapOn: "Close tools menu"
