<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CdM LMS — Administrator Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top center, #1a1e2e 0%, #0d0f17 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .logo-icon-wrapper {
      position: relative;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #FF7517, #D4A017);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      box-shadow: 0 4px 20px rgba(255, 117, 23, 0.35);
    }

    .admin-shield {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      background: #1e2436;
      border: 2px solid #FF7517;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-shield svg {
      width: 11px;
      height: 11px;
      fill: #FF7517;
    }

    .logo-text {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: #FF7517;
    }

    .subtitle-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 117, 23, 0.12);
      border: 1px solid rgba(255, 117, 23, 0.28);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      color: #FF9B4E;
      letter-spacing: 0.8px;
      margin-bottom: 36px;
      text-transform: uppercase;
    }

    .loader {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #FF7517, #D4A017, #3B82F6);
      border-radius: 4px;
      animation: loading 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .status {
      font-size: 12px;
      color: #8B92A5;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-icon-wrapper">
      <div class="logo-icon">C</div>
      <div class="admin-shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
      </div>
    </div>
    <div class="logo-text">CdM <span>LMS</span></div>
  </div>
  <div class="subtitle-badge">Administrator Console</div>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
  <div class="status">Connecting to CdM LMS Server...</div>
</body>
</html>
