<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina LMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2C2727 0%, #1a1616 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #FF7517, #D4A017);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: #FF7517;
    }

    .subtitle {
      font-size: 13px;
      color: #9CA3AF;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    .loader {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #FF7517, #D4A017, #2563EB);
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .status {
      font-size: 12px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-icon">L</div>
    <div class="logo-text">Lumina <span>LMS</span></div>
  </div>
  <div class="subtitle">LEARNING MANAGEMENT SYSTEM</div>
  <div class="loader">
    <div class="loader-bar"></div>
  </div>
  <div class="status">Loading application...</div>
</body>
</html>
