<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CdM LMS — Cannot Connect</title>
  <link rel="stylesheet" href="offline.css">
</head>
<body>
  <div class="card">
    <div class="icon-badge">⚡</div>
    <h1>Cannot Connect to CdM LMS Server</h1>
    <p class="desc">The Administrator Console could not reach <code id="server-address">the LMS server</code>. Check your connection. For local development, start the web server first.</p>
    
    <button class="action-btn" id="retry-btn">
      Check Server Status
    </button>

    <div class="hint">
      <div class="hint-title">Developer Instructions</div>
      <div class="hint-step">Step 1: Start the web server</div>
      <code>pnpm dev:web</code>
      <div class="hint-step">Step 2: Restart the desktop app</div>
      <code>pnpm dev:desktop</code>
    </div>
  </div>

  <script src="offline.js" defer></script>
</body>
</html>
