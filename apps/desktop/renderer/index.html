<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CdM LMS — Cannot Connect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0f17;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #F0F2F8;
      padding: 24px;
    }

    .card {
      background: #141824;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .icon-badge {
      width: 68px;
      height: 68px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 20px;
      color: #F87171;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    p.desc {
      font-size: 13.5px;
      color: #8B92A5;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .action-btn {
      padding: 12px 28px;
      background: #FF7517;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: #FC8236;
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      width: 100%;
      text-align: left;
    }

    .hint-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #A0AEC0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .hint-step {
      font-size: 12.5px;
      color: #8B92A5;
      margin-bottom: 4px;
    }

    .hint code {
      display: block;
      background: #0d0f17;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #FF9B4E;
      font-family: 'Consolas', 'Monaco', monospace;
      margin-top: 4px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">⚡</div>
    <h1>Cannot Connect to CdM LMS Server</h1>
    <p class="desc">The Administrator Console requires the CdM LMS web server to be running on <code>http://localhost:3000</code>.</p>
    
    <button class="action-btn" id="retry-btn" onclick="checkAndReload()">
      Check Server Status
    </button>

    <div class="hint">
      <div class="hint-title">Developer Instructions</div>
      <div class="hint-step">Step 1: Start the web server</div>
      <code>pnpm dev:web</code>
      <div class="hint-step">Step 2: Restart the desktop app</div>
      <code>pnpm dev:desktop</code>
    </div>
  </div>

  <script>
    function checkAndReload() {
      const btn = document.getElementById('retry-btn');
      btn.innerText = 'Connecting...';
      btn.disabled = true;

      fetch('http://localhost:3000/api/auth/me')
        .then(() => {
          window.location.href = 'http://localhost:3000/login?institute=ics&desktop=admin';
        })
        .catch(() => {
          btn.innerText = 'Check Server Status';
          btn.disabled = false;
          alert('Server still not reachable. Please start the Next.js server with: pnpm dev:web');
        });
    }
  </script>
</body>
</html>
