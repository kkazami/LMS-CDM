  <path d="M32 26.5V33.5M32 33.5L26.5 38.5M32 33.5L37.5 38.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- TESDA Wordmark Banner -->
  <rect x="8" y="48" width="48" height="12" rx="3" fill="#FFFFFF"/>
  <text x="32" y="57" text-anchor="middle" fill="#0038A8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10.5" letter-spacing="1.2">TESDA</text>
</svg>

