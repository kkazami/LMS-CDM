  <g fill="#FCD116">
    <rect x="28" y="5" width="8" height="7" rx="1.5"/>
    <rect x="28" y="42" width="8" height="7" rx="1.5"/>
    <rect x="9" y="23" width="7" height="8" rx="1.5"/>
    <rect x="48" y="23" width="7" height="8" rx="1.5"/>
    <rect x="14.5" y="10.5" width="7" height="7" rx="1.5" transform="rotate(-45 18 14)"/>
    <rect x="42.5" y="10.5" width="7" height="7" rx="1.5" transform="rotate(45 46 14)"/>
    <rect x="14.5" y="36.5" width="7" height="7" rx="1.5" transform="rotate(45 18 40)"/>
    <rect x="42.5" y="36.5" width="7" height="7" rx="1.5" transform="rotate(-45 46 40)"/>
  </g>
  <!-- Gear rim -->
