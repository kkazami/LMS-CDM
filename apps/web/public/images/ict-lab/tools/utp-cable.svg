<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="UTP Cat5e/Cat6 Ethernet cable showing outer jacket and four color-coded twisted wire pairs">
  <defs>
    <linearGradient id="utpJacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="stripeOrange" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" />
      <rect width="4" height="8" fill="#F58220" />
    </pattern>
    <pattern id="stripeGreen" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" />
      <rect width="4" height="8" fill="#2E9B3F" />
    </pattern>
    <pattern id="stripeBlue" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" />
      <rect width="4" height="8" fill="#1E6FD9" />
    </pattern>
    <pattern id="stripeBrown" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" />
      <rect width="4" height="8" fill="#7A4B2A" />
    </pattern>
  </defs>

  <!-- Diagram Card Frame -->
  <rect x="8" y="8" width="504" height="244" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="24" y="20" width="210" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="129" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">
    UTP CABLE (4 TWISTED PAIRS)
  </text>

  <!-- Outer PVC Cable Jacket (Left) -->
  <rect x="28" y="96" width="186" height="68" rx="10" fill="url(#utpJacketGrad)" stroke="#1e3a8a" stroke-width="2" />
  <ellipse cx="214" cy="130" rx="8" ry="34" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
  <text x="116" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
    UTP Cat5e / Cat6
  </text>
  <text x="116" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#dbeafe">
    Outer PVC Jacket
  </text>

  <!-- Nylon Ripcord -->
  <path d="M 214 156 Q 248 176 286 184" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 3" />
  <text x="292" y="188" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">
    Pull string (ripcord)
  </text>

  <!-- Pair 1: Orange / White-Orange -->
  <path d="M 214 108 C 250 82, 285 62, 345 56" fill="none" stroke="#F58220" stroke-width="6" stroke-linecap="round" />
  <path d="M 214 114 C 250 88, 285 68, 345 64" fill="none" stroke="url(#stripeOrange)" stroke-width="5" stroke-linecap="round" />
  <rect x="354" y="46" width="138" height="24" rx="5" fill="#fff7ed" stroke="#F58220" stroke-width="1.5" />
  <text x="423" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">
    Pair 1: Orange + W/O
  </text>

  <!-- Pair 2: Green / White-Green -->
  <path d="M 214 122 C 255 106, 290 98, 345 96" fill="none" stroke="#2E9B3F" stroke-width="6" stroke-linecap="round" />
  <path d="M 214 128 C 255 112, 290 104, 345 104" fill="none" stroke="url(#stripeGreen)" stroke-width="5" stroke-linecap="round" />
  <rect x="354" y="86" width="138" height="24" rx="5" fill="#f0fdf4" stroke="#2E9B3F" stroke-width="1.5" />
  <text x="423" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534">
    Pair 2: Green + W/G
  </text>

  <!-- Pair 3: Blue / White-Blue -->
  <path d="M 214 134 C 255 138, 290 138, 345 136" fill="none" stroke="#1E6FD9" stroke-width="6" stroke-linecap="round" />
  <path d="M 214 140 C 255 144, 290 144, 345 144" fill="none" stroke="url(#stripeBlue)" stroke-width="5" stroke-linecap="round" />
  <rect x="354" y="126" width="138" height="24" rx="5" fill="#eff6ff" stroke="#1E6FD9" stroke-width="1.5" />
  <text x="423" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">
    Pair 3: Blue + W/Bl
  </text>

  <!-- Pair 4: Brown / White-Brown -->
  <path d="M 214 146 C 250 162, 285 170, 345 176" fill="none" stroke="#7A4B2A" stroke-width="6" stroke-linecap="round" />
  <path d="M 214 152 C 250 168, 285 176, 345 184" fill="none" stroke="url(#stripeBrown)" stroke-width="5" stroke-linecap="round" />
  <rect x="354" y="166" width="138" height="24" rx="5" fill="#fef3c7" stroke="#7A4B2A" stroke-width="1.5" />
  <text x="423" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">
    Pair 4: Brown + W/Br
  </text>

  <!-- Footer Callout -->
  <rect x="24" y="212" width="472" height="26" rx="6" fill="#e2e8f0" />
  <text x="260" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
    8 insulated copper wires twisted in 4 color-coded pairs to reduce crosstalk
  </text>
</svg>

