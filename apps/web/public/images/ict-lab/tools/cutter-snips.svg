<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Flush wire cutter or snips trimming the 8 aligned UTP wires straight and even">
  <!-- Diagram Card Frame -->
  <rect x="8" y="8" width="504" height="244" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="24" y="20" width="204" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="126" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">
    FLUSH CUTTER OR SNIPS
  </text>

  <!-- UTP Jacket & 8 Flat Aligned Wires (Left) -->
  <rect x="30" y="96" width="110" height="44" rx="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="2" />
  <text x="85" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
    UTP Jacket
  </text>

  <!-- 8 Flat Wires Trimmed Evenly at Cut Line x=230 -->
  <g stroke-width="3.5" stroke-linecap="butt">
    <line x1="140" y1="100" x2="230" y2="100" stroke="#F58220" />
    <line x1="140" y1="105" x2="230" y2="105" stroke="#fb923c" />
    <line x1="140" y1="110" x2="230" y2="110" stroke="#2E9B3F" />
    <line x1="140" y1="115" x2="230" y2="115" stroke="#1E6FD9" />
    <line x1="140" y1="120" x2="230" y2="120" stroke="#60a5fa" />
    <line x1="140" y1="125" x2="230" y2="125" stroke="#16a34a" />
    <line x1="140" y1="130" x2="230" y2="130" stroke="#a16207" />
    <line x1="140" y1="135" x2="230" y2="135" stroke="#7A4B2A" />
  </g>

  <!-- Even Trim Line Marker -->
  <line x1="230" y1="64" x2="230" y2="176" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" />
  <text x="185" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#b91c1c">
    ~1.25 cm Even Trim
  </text>

  <!-- Flush Cutter Steel Jaws & Pivot (Right) -->
  <polygon points="232,114 302,74 316,104 242,118" fill="#64748b" stroke="#1e293b" stroke-width="2" />
  <polygon points="232,122 302,162 316,132 242,118" fill="#475569" stroke="#1e293b" stroke-width="2" />
  <circle cx="298" cy="118" r="9" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" />

  <!-- Insulated Ergonomic Handles -->
  <path d="M 312 94 Q 388 58 470 72 L 476 92 Q 394 82 318 112 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
  <path d="M 312 142 Q 388 178 470 164 L 476 144 Q 394 154 318 124 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
  <text x="404" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">
    Non-Slip Grip Handles
  </text>

  <!-- Footer Callout -->
  <rect x="24" y="212" width="472" height="26" rx="6" fill="#e2e8f0" />
  <text x="260" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
    Trims all 8 straightened wires flush so every wire reaches the tip of the RJ45 plug
  </text>
</svg>

