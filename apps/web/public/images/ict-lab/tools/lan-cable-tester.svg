<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Dual-unit LAN cable tester showing Main Unit and Remote Unit with LEDs 1 to 8 lit in sequence">
  <!-- Diagram Card Frame -->
  <rect x="8" y="8" width="504" height="244" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="24" y="20" width="244" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="146" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">
    LAN CABLE TESTER (MAIN + REMOTE)
  </text>

  <!-- Patch Cable Arc Connecting Main Unit Port to Remote Unit Port -->
  <path d="M 150 62 C 150 28, 370 28, 370 62" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <rect x="138" y="54" width="24" height="12" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.2" />
  <rect x="358" y="54" width="24" height="12" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.2" />

  <!-- Main Tester Unit (Left) -->
  <rect x="68" y="64" width="164" height="136" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
  <text x="150" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">
    MAIN UNIT (End A)
  </text>

  <!-- Main Unit 1-8 LED Row -->
  <g font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">
    <circle cx="88" cy="112" r="7" fill="#22c55e" />
    <text x="88" y="130" fill="#e2e8f0">1</text>
    <circle cx="106" cy="112" r="7" fill="#22c55e" />
    <text x="106" y="130" fill="#e2e8f0">2</text>
    <circle cx="124" cy="112" r="7" fill="#22c55e" />
    <text x="124" y="130" fill="#e2e8f0">3</text>
    <circle cx="142" cy="112" r="7" fill="#22c55e" />
    <text x="142" y="130" fill="#e2e8f0">4</text>
    <circle cx="160" cy="112" r="7" fill="#22c55e" />
    <text x="160" y="130" fill="#e2e8f0">5</text>
    <circle cx="178" cy="112" r="7" fill="#22c55e" />
    <text x="178" y="130" fill="#e2e8f0">6</text>
    <circle cx="196" cy="112" r="7" fill="#22c55e" />
    <text x="196" y="130" fill="#e2e8f0">7</text>
    <circle cx="214" cy="112" r="7" fill="#22c55e" />
    <text x="214" y="130" fill="#e2e8f0">8</text>
  </g>

  <!-- Power Switch on Main Unit -->
  <rect x="96" y="150" width="108" height="30" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <circle cx="116" cy="165" r="6" fill="#22c55e" />
  <text x="160" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff">
    ON / AUTO TEST
  </text>

  <!-- Remote Tester Unit (Right) -->
  <rect x="296" y="64" width="152" height="136" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" />
  <text x="372" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">
    REMOTE UNIT (End B)
  </text>

  <!-- Remote Unit 1-8 LED Row -->
  <g font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">
    <circle cx="312" cy="112" r="6.5" fill="#22c55e" />
    <text x="312" y="130" fill="#e2e8f0">1</text>
    <circle cx="329" cy="112" r="6.5" fill="#22c55e" />
    <text x="329" y="130" fill="#e2e8f0">2</text>
    <circle cx="346" cy="112" r="6.5" fill="#22c55e" />
    <text x="346" y="130" fill="#e2e8f0">3</text>
    <circle cx="363" cy="112" r="6.5" fill="#22c55e" />
    <text x="363" y="130" fill="#e2e8f0">4</text>
    <circle cx="380" cy="112" r="6.5" fill="#22c55e" />
    <text x="380" y="130" fill="#e2e8f0">5</text>
    <circle cx="397" cy="112" r="6.5" fill="#22c55e" />
    <text x="397" y="130" fill="#e2e8f0">6</text>
    <circle cx="414" cy="112" r="6.5" fill="#22c55e" />
    <text x="414" y="130" fill="#e2e8f0">7</text>
    <circle cx="431" cy="112" r="6.5" fill="#22c55e" />
    <text x="431" y="130" fill="#e2e8f0">8</text>
  </g>

  <rect x="316" y="150" width="112" height="30" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
  <text x="372" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ecfdf5">
    PASS: Pins 1–8 Match
  </text>

  <!-- Footer Callout -->
  <rect x="24" y="212" width="472" height="26" rx="6" fill="#e2e8f0" />
  <text x="260" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
    Pulses pins 1 to 8 in sequence to verify continuity and detect open, short, or miswired pins
  </text>
</svg>

