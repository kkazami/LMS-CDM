<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="RJ45 8P8C modular plug showing 8 gold contact pins, wire channels, strain-relief crimp tab, and locking latch">
  <!-- Diagram Card Frame -->
  <rect x="8" y="8" width="504" height="244" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="24" y="20" width="218" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="133" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">
    RJ45 CONNECTOR (8P8C PLUG)
  </text>

  <!-- Clear Polycarbonate Plug Housing (Top-View Pin 1..8 on Left) -->
  <rect x="44" y="60" width="256" height="134" rx="10" fill="#eff6ff" stroke="#475569" stroke-width="2.5" />
  <rect x="64" y="148" width="216" height="36" rx="5" fill="#dbeafe" stroke="#64748b" stroke-width="1.5" />
  <text x="172" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">
    Strain-Relief Jacket Clamp
  </text>

  <!-- 8 Gold Contacts (Pin 1 to Pin 8) -->
  <g>
    <rect x="62" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="90" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="118" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="146" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="174" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="202" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="230" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <rect x="258" y="68" width="20" height="34" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
  </g>

  <!-- Wire Guide Channels & Pin Numbers -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0f172a" text-anchor="middle">
    <text x="72" y="118">P1</text>
    <text x="100" y="118">P2</text>
    <text x="128" y="118">P3</text>
    <text x="156" y="118">P4</text>
    <text x="184" y="118">P5</text>
    <text x="212" y="118">P6</text>
    <text x="240" y="118">P7</text>
    <text x="268" y="118">P8</text>
  </g>
  <text x="172" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">
    8 Gold Contact Pins (Pin 1 Left → Pin 8 Right)
  </text>

  <!-- Side Profile Diagram (Right) showing Locking Clip/Latch -->
  <rect x="330" y="62" width="158" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="409" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">
    Side Profile &amp; Latch
  </text>
  <!-- Plug Side Body -->
  <rect x="352" y="96" width="96" height="44" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <!-- Gold Contact Teeth -->
  <rect x="358" y="98" width="22" height="12" rx="2" fill="#eab308" stroke="#a16207" stroke-width="1.2" />
  <!-- Flexible Locking Latch / Clip underneath -->
  <path d="M 372 140 L 436 164 L 440 156 L 386 140 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="409" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">
    Locking Clip (Latch Down)
  </text>

  <!-- Footer Callout -->
  <rect x="24" y="212" width="472" height="26" rx="6" fill="#e2e8f0" />
  <text x="260" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
    8-Position 8-Contact (8P8C) modular plug crimped onto the end of a UTP cable
  </text>
</svg>

