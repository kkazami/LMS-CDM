<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg-ibe-law" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="250" fill="url(#bg-ibe-law)"/>
  <!-- Architectural Pillars / Governance motif in background -->
  <g opacity="0.12" stroke="#FDE68A" stroke-width="2" fill="none">
    <rect x="470" y="45" width="30" height="160"/>
    <rect x="525" y="45" width="30" height="160"/>
  </g>
  <!-- Scales of Justice & Corporate Charter Illustration -->
  <g transform="translate(555, 36)">
    <rect x="10" y="6" width="180" height="166" rx="18" fill="#18181B" stroke="#D97706" stroke-width="3"/>
    <!-- Pillar -->
    <line x1="100" y1="36" x2="100" y2="140" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <rect x="68" y="138" width="64" height="10" rx="5" fill="#D97706"/>
    <!-- Crossbar -->
    <line x1="48" y1="56" x2="152" y2="56" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="36" r="7" fill="#FDE68A"/>
    <!-- Left Scale Pan -->
    <line x1="54" y1="56" x2="40" y2="96" stroke="#FCD34D" stroke-width="2.5"/>
    <line x1="54" y1="56" x2="68" y2="96" stroke="#FCD34D" stroke-width="2.5"/>
    <path d="M34,96 Q54,112 74,96 Z" fill="#F59E0B"/>
    <!-- Right Scale Pan -->
    <line x1="146" y1="56" x2="132" y2="96" stroke="#FCD34D" stroke-width="2.5"/>
    <line x1="146" y1="56" x2="160" y2="96" stroke="#FCD34D" stroke-width="2.5"/>
    <path d="M126,96 Q146,112 166,96 Z" fill="#F59E0B"/>
  </g>
</svg>

