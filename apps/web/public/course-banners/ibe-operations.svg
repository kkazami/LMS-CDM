<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg-ibe-ops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="250" fill="url(#bg-ibe-ops)"/>
  <!-- Process Flow Path -->
  <g opacity="0.18" stroke="#A5B4FC" stroke-width="2.5" fill="none">
    <path d="M440,70 L560,70 L610,125 L750,125" stroke-dasharray="6,6"/>
    <path d="M440,180 L560,180 L610,125"/>
  </g>
  <!-- Operations Workflow Cards & Strategy Nodes -->
  <g transform="translate(535, 40)">
    <!-- Step 1 Card -->
    <rect x="0" y="12" width="76" height="58" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="2.5"/>
    <rect x="14" y="28" width="48" height="8" rx="4" fill="#A5B4FC"/>
    <rect x="14" y="44" width="32" height="8" rx="4" fill="#6366F1"/>
    <!-- Step 2 Card -->
    <rect x="0" y="98" width="76" height="58" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="14" y="114" width="48" height="8" rx="4" fill="#7DD3FC"/>
    <rect x="14" y="130" width="32" height="8" rx="4" fill="#0284C7"/>
    <!-- Connector Lines -->
    <path d="M76,41 L115,84 M76,127 L115,84" stroke="#FBBF24" stroke-width="3"/>
    <!-- Central Operations Hub -->
    <g transform="translate(110, 32)">
      <rect x="0" y="0" width="104" height="104" rx="22" fill="#0F172A" stroke="#FBBF24" stroke-width="3.5"/>
      <circle cx="52" cy="52" r="26" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="14,6"/>
      <circle cx="52" cy="52" r="12" fill="#FBBF24"/>
    </g>
  </g>
</svg>

