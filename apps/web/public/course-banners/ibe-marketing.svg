<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg-ibe-mkt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="55%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="250" fill="url(#bg-ibe-mkt)"/>
  <!-- Concentric Target Rings -->
  <g transform="translate(650, 125)" opacity="0.2" stroke="#FDA4AF" fill="none">
    <circle cx="0" cy="0" r="95" stroke-width="2"/>
    <circle cx="0" cy="0" r="65" stroke-width="2"/>
    <circle cx="0" cy="0" r="35" stroke-width="2"/>
  </g>
  <!-- Target Bullseye & Brand Megaphone Illustration -->
  <g transform="translate(545, 42)">
    <!-- Target Board -->
    <circle cx="135" cy="85" r="58" fill="#1E1B4B" stroke="#FB7185" stroke-width="4"/>
    <circle cx="135" cy="85" r="38" fill="#881337" stroke="#FDA4AF" stroke-width="3"/>
    <circle cx="135" cy="85" r="18" fill="#F43F5E"/>
    <circle cx="135" cy="85" r="6" fill="#FEF2F2"/>
    <!-- Arrow hitting bullseye -->
    <line x1="190" y1="30" x2="140" y2="80" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <polygon points="135,85 149,81 139,71" fill="#FBBF24"/>
    <!-- Megaphone Badge -->
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="96" height="96" rx="20" fill="#0F172A" stroke="#F43F5E" stroke-width="3"/>
      <path d="M22,52 L36,52 L64,70 L64,26 L36,44 L22,44 Z" fill="#FB7185"/>
      <path d="M28,54 L33,72 L42,72 L38,54 Z" fill="#FDE68A"/>
      <path d="M72,36 C78,42 78,54 72,60" fill="none" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>

