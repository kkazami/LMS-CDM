<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg-ibe-fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="800" height="250" fill="url(#bg-ibe-fin)"/>
  <!-- Financial Ledger Grid -->
  <g opacity="0.12" stroke="#93C5FD" stroke-width="1.5" fill="none">
    <path d="M450,40 L760,40 M450,85 L760,85 M450,130 L760,130 M450,175 L760,175 M450,215 L760,215"/>
    <path d="M500,30 L500,220 M580,30 L580,220 M660,30 L660,220 M740,30 L740,220"/>
  </g>
  <!-- Financial Statement Card & Analytics -->
  <g transform="translate(540, 35)">
    <rect x="0" y="10" width="210" height="160" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="3"/>
    <!-- Top header bar -->
    <rect x="18" y="28" width="90" height="10" rx="5" fill="#60A5FA"/>
    <circle cx="182" cy="33" r="6" fill="#10B981"/>
    <!-- Candlestick / Financial Bars -->
    <rect x="24" y="105" width="22" height="45" rx="4" fill="#3B82F6"/>
    <rect x="58" y="85" width="22" height="65" rx="4" fill="#60A5FA"/>
    <rect x="92" y="68" width="22" height="82" rx="4" fill="#34D399"/>
    <rect x="126" y="48" width="22" height="102" rx="4" fill="#FBBF24"/>
    <!-- Gold Coin Emblem -->
    <g transform="translate(148, 72)">
      <circle cx="34" cy="34" r="28" fill="#F59E0B" stroke="#FEF3C7" stroke-width="3"/>
      <text x="34" y="43" text-anchor="middle" fill="#FFFBEB" font-family="sans-serif" font-size="26" font-weight="bold">₱</text>
    </g>
  </g>
</svg>

