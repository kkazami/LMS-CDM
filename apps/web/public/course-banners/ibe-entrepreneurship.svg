<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <linearGradient id="bg-ibe-entrep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="55%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bar-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="250" fill="url(#bg-ibe-entrep)"/>
  <!-- Subtle background grid & rising trend curve -->
  <g opacity="0.14" stroke="#FDE68A" stroke-width="2" fill="none">
    <line x1="430" y1="50" x2="770" y2="50"/>
    <line x1="430" y1="100" x2="770" y2="100"/>
    <line x1="430" y1="150" x2="770" y2="150"/>
    <line x1="430" y1="200" x2="770" y2="200"/>
    <path d="M440,195 Q530,175 590,120 T750,45" stroke-width="3.5"/>
  </g>
  <!-- Growth Bars & Idea Bulb Illustration on Right -->
  <g transform="translate(545, 42)">
    <!-- Rising Venture Bars -->
    <rect x="0" y="110" width="28" height="60" rx="6" fill="#92400E" opacity="0.85"/>
    <rect x="42" y="82" width="28" height="88" rx="6" fill="#B45309"/>
    <rect x="84" y="48" width="28" height="122" rx="6" fill="url(#bar-gold)"/>
    <!-- Ascending Arrow -->
    <path d="M8,96 L56,64 L98,28" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <polygon points="104,22 88,25 99,37" fill="#FDE68A"/>
    <!-- Innovation Lightbulb Badge -->
    <g transform="translate(135, 18)">
      <circle cx="44" cy="44" r="42" fill="#1E293B" stroke="#F59E0B" stroke-width="3.5"/>
      <path d="M44,18 C31,18 22,27 22,39 C22,47 27,53 32,57 L32,64 C32,66 34,68 36,68 L52,68 C54,68 56,66 56,64 L56,57 C61,53 66,47 66,39 C66,27 57,18 44,18 Z" fill="#FBBF24"/>
      <rect x="35" y="72" width="18" height="5" rx="2.5" fill="#94A3B8"/>
      <line x1="44" y1="6" x2="44" y2="12" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="18" x2="67" y2="23" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="18" x2="21" y2="23" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
    </g>
